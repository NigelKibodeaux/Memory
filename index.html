<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=.7, maximum-scale=.7, minimum-scale=.7" />
        <title>Nigel's Memory Game</title>
        <style>
            html {
                background-color: aliceblue;
            }
            body {
                padding: 0;
                margin: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            h1 {
                font-family: Arial, sans-serif;
                text-align: center;
                height: 20px;
                line-height: 20px;
                font-size: 20px;
                margin: 0;
                padding: 5px;
                flex-grow: 0;
            }
            #memory {
                flex-grow: 1;
            }

            #left-arrow,
            #right-arrow {
                font-size: 1.5em;
                font-weight: bold;
                text-decoration: none;
            }

            #left-arrow {
                float: left;
            }

            #right-arrow {
                float: right;
            }

            #left-arrow::before,
            #right-arrow::before {
                content: '';
                display: inline-block;
                width: 0;
                height: 0;
                border-style: solid;
            }

            #right-arrow::before {
                border-width: 10px 0 10px 15px;
                border-color: transparent transparent transparent black;
            }

            #left-arrow::before {
                border-width: 10px 15px 10px 0;
                border-color: transparent black transparent transparent;
            }
        </style>
        <script src="memory.js"></script>
    </head>
    <body>
        <h1>
            <a id="left-arrow"> </a>
            <span id="title"></span>
            <a id="right-arrow"> </a>
        </h1>
        <div id="memory"></div>
        <script>
            // highest number of ?.JPG, starting at 1.JPG
            const PAGES = [
                {
                    title: 'Young Kid Pictures',
                    image_url_array: Array.from({ length: 32 }, (_, i) => `${i + 1}.JPG`),
                },
                {
                    title: '2024 Family Europe Trip',
                    image_url_array: Array.from({ length: 32 }, (_, i) => `${i + 33}.JPG`),
                },
                {
                    title: '2026 Family Alaska Visit',
                    image_url_array: Array.from({ length: 12 }, (_, i) => `${i + 65}.JPG`),
                },
            ]

            // get the starting index from the query string or use 1
            var page = parseInt(new URLSearchParams(window.location.search).get('page')) || 1
            var images_in_album = PAGES[page - 1]?.count

            // set the title
            var titleElement = document.querySelector('#title')
            titleElement.textContent = PAGES[page - 1]?.title

            // show or hide the left arrow
            var leftArrow = document.querySelector('#left-arrow')
            if (page > 1) {
                leftArrow.style.display = 'inline'
                leftArrow.href = '?page=' + (page - 1)
            } else {
                leftArrow.style.display = 'none'
            }

            // show or hide the right arrow
            var rightArrow = document.querySelector('#right-arrow')
            if (page < PAGES.length) {
                rightArrow.style.display = 'inline'
                rightArrow.href = '?page=' + (page + 1)
            } else {
                rightArrow.style.display = 'none'
            }

            createMemoryGame({
                image_url_array: PAGES[page - 1].image_url_array,
                image_size: 120,
                container_element: document.querySelector('#memory'),
            })
        </script>
    </body>
</html>
